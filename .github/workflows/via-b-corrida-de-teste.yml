name: Via B — corrida de teste (não grava)

# 30/09/2026. Corre o script 5 pela via B (a Edge Function trends-buscar-grupo) em ensaio:
# --dry-run, nada é gravado na base. Serve para comparar, no mesmo dia, com uma corrida pelo
# pytrends no Mac — critério em docs/sessoes/2026-09-30-cowork.md §12; comparação com
# scripts/comparar_vias.py.
#
# Não substitui o youtube-trends.yml, e não toca nele.
#
# 01/10/2026: VERSÃO NOVA da via B (região fixa eu-west-1, registo por tentativa, segunda
# volta — docs/sessoes/2026-10-01-cowork.md §5). As três corridas de teste recomeçam:
# 01/10 (à mão), 02/10 (à mão) e segunda 05/10 (cron), cada uma com o pytrends no Mac no
# mesmo dia. Critério: 2026-09-30-cowork.md §14.
#
# O CRON DE SEGUNDA É TEMPORÁRIO: sai deste ficheiro depois da corrida de 05/10. Se ficar,
# corre outra vez a 12/10. Não deixar ficar por esquecimento.
# Fora da hora certa. Leitura não verificada (documentação do GitHub não consultada a
# 01/10): o GitHub atrasa, e pode descartar, agendamentos à hora certa. Verificado: a
# corrida de 01/10 marcada para as 06:00 UTC arrancou às 11:53 UTC.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'  # segundas, 05:23 UTC (06:23 Lisboa, hora de Verão) — sai depois de 05/10

env:
  SUPABASE_URL: https://ijpxjpbjudaddfatibfl.supabase.co
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqcHhqcGJqdWRhZGRmYXRpYmZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NzEzODUsImV4cCI6MjA4ODU0NzM4NX0.SfOLBTYyIhk-CxzvtlvFu1E-GqBNXN3CbFqz8qx-BoM

jobs:
  via-funcao:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # a segunda volta pode juntar até 15 min (3 passos × 300 s, mais os pedidos)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Só biblioteca padrão: com --via funcao o pytrends não é importado.
      # --dry-run: a tranca do script 5 impede a via funcao de gravar, mas aqui nem se pede.
      - name: Script 5 pela via funcao (--dry-run)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/5_fetch_google_trends.py --dry-run --via funcao \
            --timeframe 'today 5-y' --dump dump-via-funcao.json

      - name: Guardar o dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dump-via-funcao-${{ github.run_id }}
          path: dump-via-funcao.json
          if-no-files-found: warn
